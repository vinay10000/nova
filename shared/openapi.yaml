openapi: 3.0.3
info:
  title: Nova API
  version: 0.1.0
  description: Chat + Agent platform. Backend owns Gemini keys. Android/web/iOS share this contract (§48).
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health
      responses: { '200': { description: ok } }
  /v1/auth/register:
    post:
      summary: Register (§29) — returns { token, user }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string, minLength: 8 }
      responses: { '200': { description: ok }, '409': { description: email_taken } }
  /v1/auth/login:
    post:
      summary: Login (§29) — same response for unknown user and bad password
      responses: { '200': { description: ok }, '401': { description: invalid_credentials } }
  /v1/me:
    get:
      summary: Current user from session token (§29 — never trusts client userId)
      responses: { '200': { description: ok }, '401': { description: unauthenticated } }
  /v1/models:
    get:
      summary: Model registry for the §7 selector
      responses: { '200': { description: ok } }
  /v1/conversations:
    get:
      summary: List/search conversations (§8) — q, archived query params
      responses: { '200': { description: ok } }
    post: { summary: Create conversation, responses: { '200': { description: ok } } }
  /v1/conversations/{id}:
    get: { summary: Conversation + messages, responses: { '200': { description: ok }, '404': { description: not_found } } }
    patch: { summary: Rename/archive (§8), responses: { '200': { description: ok } } }
    delete: { summary: Delete (§8), responses: { '200': { description: ok } } }
  /v1/chat/stream:
    post:
      summary: Streaming chat (SSE) — §3 normal chat, §10 attachments, and validated tool-backed UI blocks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [conversationId, message]
              properties:
                conversationId: { type: string }
                message: { type: string, maxLength: 32000 }
                model: { type: string }
                attachmentIds: { type: array, items: { type: string }, maxItems: 5 }
      responses:
        '200':
          description: text/event-stream; events include token, reasoning, step, ui, done, and error
          content:
            text/event-stream:
              schema:
                type: string
                example: 'data: {"type":"ui","blocks":[{"type":"metrics","id":"issues-metrics","metrics":[{"label":"open","value":"3"}]}]}'
  /v1/files:
    post:
      summary: Upload file (§10) — multipart, magic-byte sniff, 20MB cap; returns metadata only
      responses: { '200': { description: stored file metadata }, '400': { description: empty_file|file_too_large|unsupported_type } }
  /v1/files/{id}:
    get: { summary: File metadata (§10 — binary stays server-side), responses: { '200': { description: ok }, '404': { description: not_found } } }
  /v1/tts:
    post:
      summary: Text-to-speech (§11) — Gemini 2.5 Flash Native Audio Dialog, returns audio/wav; device TTS is the fallback
      responses: { '200': { description: audio/wav }, '503': { description: tts_unconfigured } }
  /v1/agents:
    get: { summary: List agents (§13), responses: { '200': { description: ok } } }
    post:
      summary: Create agent config draft (§13 — review before activate; unknown tool id = 400)
      responses: { '200': { description: ok }, '400': { description: invalid_input|unknown_tool } }
  /v1/agents/build:
    post:
      summary: NL builder (§12/§59) — prompt -> agent config or {questions[]}
      responses: { '200': { description: ok }, '429': { description: rate_limited retryable } }
  /v1/agents/{id}:
    get: { summary: Agent detail (§45), responses: { '200': { description: ok }, '404': { description: not_found } } }
    patch: { summary: Edit config before activate (§13), responses: { '200': { description: ok } } }
  /v1/agents/{id}/activate:
    post: { summary: Activate agent, responses: { '200': { description: ok } } }
  /v1/agents/{id}/pause:
    post: { summary: Pause agent, responses: { '200': { description: ok } } }
  /v1/agents/{id}/run:
    post:
      summary: Run Now (§33) — inline by default; body {background:true} detaches the run (QUEUED, 10-min budget, poll /v1/executions/{id}, cancel via /cancel)
      responses: { '200': { description: ok }, '404': { description: not_found } }
  /v1/tools:
    get: { summary: Tool registry for the visual editor (§13), responses: { '200': { description: ok } } }
  /v1/executions:
    get: { summary: Execution history (§34-§35, ?agentId=), responses: { '200': { description: ok } } }
  /v1/executions/{id}:
    get: { summary: Execution detail with step timeline (§44), responses: { '200': { description: ok } } }
  /v1/executions/{id}/cancel:
    post: { summary: Cancel a queued/running/waiting execution, responses: { '200': { description: ok } } }
  /v1/approvals:
    get: { summary: Pending checkpoints (§36, ?status=), responses: { '200': { description: ok } } }
  /v1/approvals/{id}:
    post:
      summary: Approve/Reject human checkpoint (§36; resume-on-decision is Phase 5)
      responses: { '200': { description: ok } }
  /v1/connections:
    get: { summary: OAuth connections (§38), responses: { '200': { description: ok } } }
  /v1/connections/github/authorize:
    get: { summary: Start GitHub OAuth (§38), responses: { '200': { description: ok } } }
  /v1/connections/github/callback:
    get: { summary: GitHub OAuth callback (§38), responses: { '200': { description: redirect } } }
  /v1/connections/github/status:
    get: { summary: GitHub connection status (§38), responses: { '200': { description: ok } } }
  /v1/connections/gmail/authorize:
    get: { summary: Start Gmail OAuth (§38 — Google consent, offline access), responses: { '200': { description: ok }, '500': { description: gmail_oauth_config_error } } }
  /v1/connections/gmail/callback:
    get: { summary: Gmail OAuth callback (§38), responses: { '200': { description: redirect } } }
  /v1/connections/gmail/status:
    get: { summary: Gmail connection status (§38), responses: { '200': { description: ok } } }
  /v1/plugins:
    get: { summary: Chat plugins — @mentions (§42: github,gmail,leetcode,calendar,drive,docs,sheets,vercel,supabase), responses: { '200': { description: ok } } }
  /v1/connections/drive/authorize:
    get: { summary: Start Drive OAuth (covers Docs+Sheets, F2), responses: { '200': { description: ok } } }
  /v1/connections/drive/callback:
    get: { summary: Drive OAuth callback (F2), responses: { '200': { description: redirect } } }
  /v1/connections/drive/status:
    get: { summary: Drive connection status (F2), responses: { '200': { description: ok } } }
  /v1/connections/vercel:
    post: { summary: Connect Vercel with a token (F2), responses: { '200': { description: ok } } }
  /v1/connections/vercel/status:
    get: { summary: Vercel connection status (F2), responses: { '200': { description: ok } } }
  /v1/connections/supabase:
    post: { summary: Connect Supabase with project ref + key (F2), responses: { '200': { description: ok } } }
  /v1/connections/supabase/status:
    get: { summary: Supabase connection status (F2), responses: { '200': { description: ok } } }
